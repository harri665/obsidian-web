<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Obsidian Starter</title>
  <link href="/obsidian/app.css" type="text/css" rel="stylesheet"/>
</head>
<body class="theme-dark starter">

  <script src="/client/shims/telemetry.js?v=3"></script>
  <script src="/client/shims/sync-http.js?v=3"></script>
  <script src="/client/shims/path.js?v=3"></script>
  <script src="/client/shims/url.js?v=3"></script>
  <script src="/client/shims/os.js?v=3"></script>
  <script src="/client/shims/btime.js?v=3"></script>
  <script src="/client/shims/original-fs.js?v=3"></script>
  <script src="/client/shims/electron.js?v=3"></script>
  <script src="/client/boot.js?v=3"></script>

  <script src="/obsidian/lib/i18next.min.js"></script>
  <script src="/obsidian/enhance.js"></script>
  <script src="/obsidian/i18n.js"></script>
  <script src="/obsidian/starter.js"></script>

  <!-- Intercept Obsidian's "Manage vaults" button and redirect to our page.
       Obsidian's manage-vaults modal silently fails in the browser context,
       so we fall back to /manage after a short delay if nothing happened. -->
  <script>
  (function () {
    var redirectTimer = null;

    // Capture-phase listener fires before Obsidian's handlers.
    document.addEventListener('click', function (e) {
      var el = e.target;
      // Walk up to find the actual button element.
      for (var i = 0; i < 5 && el && el !== document.body; i++, el = el.parentElement) {
        var tag = el.tagName;
        if (tag !== 'BUTTON' && tag !== 'A' && el.getAttribute('role') !== 'button') continue;
        var text = (el.textContent || '').trim().toLowerCase();
        // Match English "manage" or Hebrew "ניהול" (manage).
        if (text.indexOf('manage') === -1 && text.indexOf('ניהול') === -1) break;
        // Found the manage-vaults button. Give Obsidian 400 ms to open a modal.
        // If nothing appears, navigate to our vault management page.
        clearTimeout(redirectTimer);
        redirectTimer = setTimeout(function () {
          if (!document.querySelector('.modal-container, .modal-bg, .prompt')) {
            location.href = '/manage';
          }
        }, 400);
        break;
      }
    }, true); // capture phase
  })();
  </script>

</body>
</html>
